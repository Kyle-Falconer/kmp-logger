#
# Detekt configuration tweaks. These are documented at
#   https://detekt.github.io/detekt/configurations.html
#   https://detekt.github.io/detekt/comments.html
# Also helpful are the Detekt default settings at
#   https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml
#

style:
  DataClassShouldBeImmutable:
    active: true
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    active: true
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*Test.kt',
    ]
    excludeCommentStatements: true
comments:
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  UndocumentedPublicClass:
    active: true
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  UndocumentedPublicFunction:
    active: true
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  UndocumentedPublicProperty:
    active: true
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
complexity:
  LongParameterList:
    constructorThreshold: 12
    functionThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
  LongMethod:
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
naming:
  InvalidPackageDeclaration:
    active: true
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludes: [
      '**/src/*Test/**/*.kt',
      '**/src/test/**/*.kt',
    ]
