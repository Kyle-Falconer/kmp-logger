VERSION_NAME=0.1.0-SNAPSHOT
GROUP=software.amazon.app.kmplogger

POM_DESCRIPTION=A unified logging mechanism for Kotlin Multiplatform applications.
POM_INCEPTION_YEAR=2025

POM_URL=https://github.com/amzn/kmp-logger/
POM_SCM_URL=https://github.com/amzn/kmp-logger/
POM_SCM_CONNECTION=scm:git:git://github.com/amzn/kmp-logger.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/amzn/kmp-logger.git

POM_LICENCE_NAME=Apache-2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=amzn
POM_DEVELOPER_NAME=Amazon
POM_DEVELOPER_URL=https://github.com/amzn

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.distribution.downloadFromMaven=true
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true

# Publishing
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=false

# Development
development=true
